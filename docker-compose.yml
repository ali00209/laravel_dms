version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: dms-laravel-app

    env_file:
      - .env.production

    environment:
      APP_ENV: production

      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_CLIENT: phpredis
      REDIS_HOST: internal
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:latest

    container_name: dms-laravel-nginx

    ports:
      - "80:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

  postgres:
    image: postgres:17

    container_name: dms-laravel-postgres

    environment:
      POSTGRES_DB: dms_php
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: dms-laravel-redis

volumes:
  postgres_data:
